<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://www.googleapis.com https://*.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2447">
<meta name="application-name" content="Diamond DJ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diamond DJ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Diamond DJ</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="head">
    <img class="logo" src="icons/logo.png" alt="">
    <button class="team-name" id="teamName" aria-label="Choose team">Diamond DJ</button>
    <nav class="tabs" aria-label="Screens">
      <div class="tab-group">
        <span class="group-label in-game">In game</span>
        <div class="group game">
          <button data-view="game" aria-current="page">Game</button>
          <button data-view="lineup">Lineup</button>
        </div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="tab-group setup-group">
        <span class="group-label">Pre-game setup</span>
        <div class="group setup">
          <button data-view="roster">Roster</button>
          <button data-view="songs">Songs</button>
          <button data-view="moments">Moments</button>
        </div>
      </div>
    </nav>
    <button class="lock-btn" id="lockBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Lock</span>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main" class="main"></main>

  <footer class="dock" aria-label="Now playing">
    <div class="dock-info" id="dockInfo"><span class="dock-idle">Nothing playing</span></div>
    <label class="vol"><span>Volume</span><input id="master" type="range" min="0" max="1" step="0.01" value="1"></label>
    <button class="btn fade" id="fadeAll">Fade out</button>
    <button class="btn stop" id="stopAll">Stop</button>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="btn" id="dlgClose">Done</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="version.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
